<div class="booking-list">
  <div class="booking-list__header">
    <div>
      <h1>Daftar Booking</h1>
      <p class="booking-list__subtitle">Kelola semua jadwal booking di sini</p>
    </div>
    <a routerLink="/booking/create" class="btn-primary">+ Booking Baru</a>
  </div>

  <div class="booking-list__card glass-card">
    <div class="booking-list__toolbar">
      <input
        type="text"
        placeholder="🔍 Cari resource, user, atau status..."
        [(ngModel)]="quickFilterText"
        class="booking-list__search"
      />
    </div>

    @if (loading()) {
      <p class="booking-list__loading">Memuat data...</p>
    } @else {
      <ag-grid-angular
        class="ag-theme-quartz booking-grid"
        [rowData]="bookings()"
        [columnDefs]="colDefs"
        [defaultColDef]="defaultColDef"
        [pagination]="true"
        [paginationPageSize]="10"
        [quickFilterText]="quickFilterText"
        style="width: 100%; height: 460px;"
      />
    }
  </div>
</div>
